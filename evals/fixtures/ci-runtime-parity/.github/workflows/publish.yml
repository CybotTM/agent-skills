name: Reusable fixture publication
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22.23.3'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm ci
      - run: npm run build
      - run: echo "Publication is simulated in this fixture"
